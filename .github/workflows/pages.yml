name: Website

# Publishes site/ to GitHub Pages. The gallery is rendered from examples/
# with the current umpl CLI, so it always shows the real layout.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "examples/**"
      - "assets/**"
      - "crates/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --release -p umpl-cli

      - name: Render gallery
        run: |
          mkdir -p site/gallery
          for f in examples/*.umpl; do
            n=$(basename "$f" .umpl)
            ./target/release/umpl render "$f" --tidy -o "site/gallery/$n.svg"
            ./target/release/umpl render "$f" --tidy --dark -o "site/gallery/$n-dark.svg"
          done
          cp assets/icon.svg site/icon.svg
          sed -i "s#__REPO__#${GITHUB_REPOSITORY}#g" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
