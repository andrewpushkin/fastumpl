name: Release

# Every push to main publishes a release, version 0.1.N, where N is the
# number of commits on main (scripts/version.sh). Linux and Windows
# packages are built with the same `make` targets as locally, inside the
# Docker image; the macOS .dmg is built natively on a macOS runner.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: echo "version=$(scripts/version.sh)" >> "$GITHUB_OUTPUT"

  linux-windows:
    name: Linux and Windows packages (make, Docker)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packages
        run: make all

      - name: List packages
        run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-windows
          path: |
            dist/fastumpl-linux-x86_64.tar.gz
            dist/fastumpl-linux-x86_64.deb
            dist/fastumpl-windows-x86_64-portable.zip
            dist/fastumpl-windows-x86_64-setup.exe
            dist/fastumpl-windows-arm64-portable.zip
            dist/fastumpl-windows-arm64-setup.exe
          if-no-files-found: error

  macos:
    name: macOS universal (.dmg)
    needs: version
    # The current macOS image (Apple Silicon); pinned versions get retired.
    runs-on: macos-latest
    env:
      UMPL_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain and targets
        run: |
          rustup toolchain install
          rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build app and .dmg
        run: packaging/macos/build.sh "$UMPL_VERSION" dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/fastumpl-macos-universal.dmg
          if-no-files-found: error

  check-windows:
    name: Check Windows packages on Windows
    needs: linux-windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-windows

      - name: Portable zip runs
        shell: pwsh
        run: |
          Expand-Archive fastumpl-windows-x86_64-portable.zip -DestinationPath portable
          $p = "portable\fastumpl-windows-x86_64-portable"
          & "$p\umpl.exe" --version
          & "$p\umpl.exe" render "$p\examples\shop.umpl" -o shop.svg
          if (!(Test-Path shop.svg)) { exit 1 }

      - name: Installer installs and uninstalls
        shell: pwsh
        run: |
          $setup = Start-Process -Wait -PassThru -FilePath .\fastumpl-windows-x86_64-setup.exe `
            -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/TASKS=association','/LOG=setup.log'
          $dir = "$env:LOCALAPPDATA\Programs\fastumpl"
          if ($setup.ExitCode -ne 0 -or !(Test-Path "$dir\fastumpl.exe")) { Get-Content setup.log; exit 1 }
          & "$dir\umpl.exe" --version
          if (!(Test-Path "HKCU:\Software\Classes\.umpl")) { Write-Error ".umpl not registered"; exit 1 }
          Start-Process -Wait -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          Start-Sleep -Seconds 3
          if (Test-Path "$dir\fastumpl.exe") { Write-Error "uninstall left files"; exit 1 }

  publish:
    name: Publish release
    needs: [version, linux-windows, macos, check-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum fastumpl-* > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: fastumpl ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: |
            fastumpl-linux-x86_64.tar.gz
            fastumpl-linux-x86_64.deb
            fastumpl-windows-x86_64-portable.zip
            fastumpl-windows-x86_64-setup.exe
            fastumpl-windows-arm64-portable.zip
            fastumpl-windows-arm64-setup.exe
            fastumpl-macos-universal.dmg
            SHA256SUMS.txt
